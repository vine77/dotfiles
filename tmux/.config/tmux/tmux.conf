# Colour passthrough for vim's monokai_machine theme.
#
# tmux 3.7 already picks both of these up on its own when the outer terminal
# exports COLORTERM=truecolor, which iTerm2 does — `client_termfeatures`
# reports RGB with no config at all. These lines make it deterministic rather
# than dependent on COLORTERM surviving: over ssh, under a terminal that does
# not set it, or on an older tmux whose default-terminal is still `screen`
# (which has neither RGB nor italics), the theme would silently lose truecolor
# and italic comments.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
